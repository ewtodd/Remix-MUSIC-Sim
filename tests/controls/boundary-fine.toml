[gas]
species     = "4He"
pressure    = 423.0
temperature = 293.0

[beam]
species     = "17F"
energy      = 100.0
energy_fwhm = 0.0

[target]
species  = "4He"
compound = "21Na"

[windows.entrance]
thickness_mg_cm2 = -1.0

