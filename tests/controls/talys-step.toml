[gas]
species     = "4He"
pressure    = 220.0
temperature = 293.0

[beam]
species     = "37Cl"
energy      = 92.0
energy_fwhm = 0.0

[target]
species  = "4He"
compound = "41K"

[windows.entrance]
thickness_mg_cm2 = -1.0

[windows.exit]
thickness_mg_cm2 = -1.0

[detector]
eloss_bins  = 100
max_eloss   = 10.0
strip_first = 2
strip_last  = 3

# Step-level talys: one implicit branch, no branch tables.
[[reaction.step]]
residue_excitation   = "talys"
level_table          = "../fixtures/talys-levels.tab"
angular_distribution = "isotropic"

[reaction.step.evap]
name = "1H"

[reaction.step.res]
name = "40Ar"

[physics]
straggling = false

[run]
events_per_strip = 20
threads          = 1
wait             = 0
update           = 0
max_time         = 2000.0
sim_step         = 0.01
method           = 0
output           = "talys-step.root"
file_opt         = "recreate"
print_opt        = 0
seed             = 106
