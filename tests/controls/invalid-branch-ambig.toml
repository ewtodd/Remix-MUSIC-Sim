# Rejected: step-level models alongside [[reaction.step.branch]] tables.
[gas]
species     = "4He"
pressure    = 220.0
temperature = 293.0

[beam]
species     = "37Cl"
energy      = 92.0
energy_fwhm = 0.0

[target]
species  = "4He"
compound = "41K"

[detector]
eloss_bins  = 100
max_eloss   = 10.0
strip_first = 2
strip_last  = 9

[[reaction.step]]
residue_excitation   = "ground"
angular_distribution = "rutherford"

[reaction.step.evap]
name = "4He"

[reaction.step.res]
name = "37Cl"

[[reaction.step.branch]]
residue_excitation   = "ground"
angular_distribution = "rutherford"
weight               = 0.99

[[reaction.step.branch]]
residue_excitation   = "talys"
level_table          = "../fixtures/talys-levels.tab"
angular_distribution = "isotropic"
weight               = 0.01

[run]
events_per_strip = 1
output           = "invalid.root"
seed             = 1
