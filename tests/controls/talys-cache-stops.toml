[gas]
species     = "4He"
pressure    = 220.0
temperature = 293.0

[beam]
species     = "37Cl"
energy      = 30.0
energy_fwhm = 6.0

[target]
species  = "4He"
compound = "41K"

[windows.entrance]
thickness_mg_cm2 = -1.0

[windows.exit]
thickness_mg_cm2 = -1.0

[detector]
eloss_bins  = 100
max_eloss   = 10.0
strip_first = 13
strip_last  = 16

# The aa class with a beam that stops in strip 14 on average: strips 13-14
# have no (a,a') channel open, and 15-16 lie beyond the mean beam's range, but
# the 6 MeV spread still takes some beam there to scatter elastically.
[reaction]
talys_class      = "Cl"
theta_cm_min_deg = 120.0

[physics]
straggling = false

[run]
events_per_strip = 200
threads          = 2
wait             = 0
update           = 0
max_time         = 2000.0
sim_step         = 0.01
method           = 0
output           = "talys-cache-stops.root"
file_opt         = "recreate"
print_opt        = 0
seed             = 112

[talys]
keywords = ["bins 40"]
