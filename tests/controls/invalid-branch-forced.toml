# Rejected: 'forced' excitation is not supported inside a branch.
[gas]
species     = "4He"
pressure    = 0.0
temperature = 293.0

[beam]
species     = "98Zr"
energy      = 400.0
energy_fwhm = 0.0

[target]
species  = "4He"
compound = "102Mo"

[detector]
eloss_bins = 100
max_eloss  = 30.0
strip      = 0

[[reaction.step]]
[reaction.step.evap]
name = "1n"

[reaction.step.res]
name = "101Mo"

[[reaction.step.branch]]
residue_excitation   = "forced"
angular_distribution = "isotropic"
weight               = 1.0

[[reaction.step]]
residue_excitation   = "ground"
angular_distribution = "isotropic"

[reaction.step.evap]
name = "1n"

[reaction.step.res]
name = "100Mo"

[run]
events_per_strip = 1
output           = "invalid.root"
seed             = 1
