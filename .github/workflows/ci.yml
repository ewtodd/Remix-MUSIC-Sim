name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build the Nix package
        run: nix build --no-link --print-build-logs
      - name: Build and run regression tests
        run: nix develop --command make -j2 check
      - name: Enforce compiler warnings
        run: nix develop --command make strict
      - name: Run sanitizer regression tests
        run: nix develop --command make -j2 sanitize-check
      - name: Enforce C++ and TOML formatting
        run: nix develop --command make format-check
